<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SWT · Báo cáo kiểm thử</title><link rel="stylesheet" href="/style.css"></head>
<body><header><div><p class="eyebrow">DATE TIME CHECKER / SWT</p><h1>Báo cáo kiểm thử</h1><p class="subtitle">Kết quả Local và GitHub Actions trong cùng một nơi.</p></div><button id="refresh">Tải lại kết quả</button></header>
