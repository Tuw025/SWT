name: Student Lab CI and delivery

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      performance_profile:
        description: k6 profile (UI R14 is measured separately)
        type: choice
        options: [observe, load, stress]
        default: observe
      run_mobile:
        description: Run all 44 Flutter cases on an Android emulator
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: student-labs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independent-tests:
    name: ${{ matrix.topic }} - student cases
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        topic: [api, web, visual, ui-performance, ai]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Build, start backend, run cases, stop backend
        run: node ci/run-topic.cjs ${{ matrix.topic }}
      - name: Save report, traces, screenshots, request and response evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lab-${{ matrix.topic }}-${{ github.run_attempt }}
          path: |
            reports/dashboard/jobs/
          retention-days: 14

  performance:
    name: k6 API performance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: '2.3.0'
      - name: Run Lab data through k6
        env:
          K6_BINARY: k6
          PERFORMANCE_PROFILE: ${{ inputs.performance_profile || 'observe' }}
        run: node ci/run-topic.cjs performance --profile "$PERFORMANCE_PROFILE"
      - name: Save metrics and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lab-performance-${{ github.run_attempt }}
          path: |
            reports/dashboard/jobs/
          retention-days: 14

  mobile:
    name: Flutter Android - student cases
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_mobile }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools emulator'
      - name: Verify SDK manager is available
        run: |
          command -v sdkmanager
          sdkmanager --version
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true
      - run: npm ci
      - name: Install SDK components matching the pinned Flutter version
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot emulator and run all mobile Lab cases
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: node ci/run-topic.cjs mobile --device emulator-5554
      - name: Save mobile results and step logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lab-mobile-${{ github.run_attempt }}
          path: |
            reports/dashboard/jobs/
          retention-days: 14

  delivery:
    name: Deliver tested backend and web package
    needs: [independent-tests, performance, mobile]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.independent-tests.result == 'success' && needs.performance.result == 'success' && (needs.mobile.result == 'success' || needs.mobile.result == 'skipped') }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Publish backend with the web files
        run: dotnet publish apps/backend/DateTimeChecker.Api.csproj --configuration Release --output delivery/app
      - name: Record exactly which test groups gated this package
        env:
          MOBILE_RESULT: ${{ needs.mobile.result }}
        shell: pwsh
        run: |
          @{ commit = '${{ github.sha }}'; backendWebTests = 'passed'; apiPerformance = 'passed'; ai = 'Only approved cases run; see AI job summary for PASS or SKIP'; mobile = $env:MOBILE_RESULT; deployment = 'not configured' } | ConvertTo-Json | Set-Content delivery/app/test-scope.json
          Compress-Archive -Path delivery/app/* -DestinationPath delivery/date-time-checker.zip
      - uses: actions/upload-artifact@v7
        with:
          name: date-time-checker-${{ github.run_number }}
          path: delivery/date-time-checker.zip
          retention-days: 14

  report:
    name: Aggregate Allure dashboard report
    needs: [independent-tests, performance, mobile, delivery]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Collect available results, including failed test jobs
        uses: actions/download-artifact@v7
        with:
          pattern: lab-*
          path: reports/dashboard-input
      - name: Generate a report for this workflow run
        if: ${{ !cancelled() }}
        env:
          DASHBOARD_NEEDS: ${{ toJSON(needs) }}
        run: node ci/report-dashboard.cjs
      - name: Save dashboard bundle for automatic local synchronization
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: swt-dashboard-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/dashboard-bundle/
          if-no-files-found: error
          retention-days: 14
